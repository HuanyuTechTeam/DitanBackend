# Alembic configuration (ASCII for Windows locale compatibility)

[alembic]
# Migration script directory
script_location = alembic

# Add the project directory to the import path
prepend_sys_path = .

# Path separator
path_separator = os

# Optional migration filename timezone
# timezone =

# Output encoding
output_encoding = utf-8

# Database URL (overridden by env.py)
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Optional post-generation hooks

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

